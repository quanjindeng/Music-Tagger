name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed main_gui.py
          dir dist

      - name: Prepare Windows signing (if secret provided)
        if: ${{ secrets.WINDOWS_PFX_B64 != '' }}
        shell: pwsh
        run: |
          Write-Host "Decoding PFX..."
          $pfx_b64 = "${{ secrets.WINDOWS_PFX_B64 }}"
          [IO.File]::WriteAllBytes('release.pfx', [Convert]::FromBase64String($pfx_b64))

      - name: Sign EXE(s) (if PFX available)
        if: ${{ secrets.WINDOWS_PFX_B64 != '' }}
        shell: pwsh
        run: |
          Write-Host "Signing all EXE files in dist\\"
          $pfx = Resolve-Path release.pfx
          $password = "${{ secrets.WINDOWS_PFX_PASSWORD }}"
          Get-ChildItem -Path dist -Filter *.exe | ForEach-Object {
            $in = $_.FullName
            $out = $_.FullName -replace '\\' , '\\'
            Write-Host "Signing $in"
            # Try signtool if present
            if (Get-Command signtool -ErrorAction SilentlyContinue) {
              signtool sign /f "$($pfx)" /p $password /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$in"
            } else {
              Write-Host "signtool not found; attempting to use osslsigncode"
              choco install -y osslsigncode
              & osslsigncode sign -pkcs12 "$($pfx)" -pass $password -n "MusicTagger" -in "$in" -out "$in.signed.exe"
              Move-Item -Force "$in.signed.exe" "$in"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-tagger-windows
          path: dist/*.exe

      - name: Create GitHub Release (when triggered by tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: |
            dist/*.exe
