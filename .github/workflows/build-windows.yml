name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed main_gui.py
          dir dist

      - name: Upload unsigned EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-tagger-windows-unsigned
          path: dist/*.exe

      - name: Decode Windows PFX (if provided)
        if: ${{ secrets.WINDOWS_PFX_B64 }}
        shell: pwsh
        run: |
          Write-Host "Decoding PFX to release.pfx"
          $pfx_b64 = "${{ secrets.WINDOWS_PFX_B64 }}"
          [IO.File]::WriteAllBytes('release.pfx', [Convert]::FromBase64String($pfx_b64))
          Write-Host "PFX written."

      - name: Sign EXE(s) (if PFX provided)
        if: ${{ secrets.WINDOWS_PFX_B64 }}
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          Write-Host "Signing EXE(s) in dist\ ..."
          $pfx = Resolve-Path release.pfx
          $password = $env:PFX_PASS

          $exeFiles = Get-ChildItem -Path dist -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $exeFiles) {
            Write-Host "No EXE files found in dist/. Nothing to sign."
            exit 0
          }

          # Try to use signtool if available (Windows SDK). Otherwise fallback to osslsigncode installed via choco.
          $signtool = Get-Command signtool -ErrorAction SilentlyContinue
          foreach ($f in $exeFiles) {
            $filePath = $f.FullName
            if ($signtool) {
              Write-Host "Signing $filePath with signtool"
              signtool sign /f "$($pfx)" /p $password /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$filePath"
            } else {
              Write-Host "signtool not found; installing osslsigncode (may take a while)"
              choco install -y osslsigncode
              # osslsigncode will create a new file; replace the original afterwards
              $out = "$filePath.signed.exe"
              osslsigncode sign -pkcs12 "$($pfx)" -pass $password -n "MusicTagger" -t http://timestamp.digicert.com -in "$filePath" -out "$out"
              if (Test-Path $out) { Move-Item -Force $out $filePath }
            }
          }

      - name: Upload signed EXE artifact (if PFX provided)
        if: ${{ secrets.WINDOWS_PFX_B64 }}
        uses: actions/upload-artifact@v4
        with:
          name: music-tagger-windows-signed
          path: dist/*.exe

      - name: Create GitHub Release (when triggered by tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: |
            dist/*.exe
