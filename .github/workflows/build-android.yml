name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      PIP_NO_CACHE_DIR: "false"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Android SDK / build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system packages required for building Kivy / Android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool libtool-bin m4 \
            build-essential \
            pkg-config \
            git \
            unzip \
            wget \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libmtdev-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libjpeg-dev \
            libfreetype6-dev \
            python3-dev \
            libpython3-dev

      - name: Setup autotools macros
        run: |
          sudo apt-get install -y m4
          # Ensure libtoolize is available and register m4 macros
          which libtoolize || which glibtoolize
          aclocal --version
          autoconf --version
          automake --version

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install Python build tools and Buildozer (in venv)
        run: |
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install cython
          pip install --upgrade buildozer

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install project Python requirements (if any)
        run: |
          source .venv/bin/activate
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Prepare Buildozer configuration (optional)
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "WARNING: buildozer.spec not found in repo root. Make sure you have it configured."
          fi

      - name: Run buildozer to build Android debug APK (non-interactive)
        working-directory: ${{ github.workspace }}
        env:
          # Bypass libtool version issues by using system libffi
          LDFLAGS: "-L/usr/lib/x86_64-linux-gnu"
          CPPFLAGS: "-I/usr/include"
        run: |
          source .venv/bin/activate
          # Ensure we run as non-root; pipe 'yes' as fallback for any prompts
          yes y | buildozer -v android debug
