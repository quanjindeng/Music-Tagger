name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # 确保 pip 使用缓存目录
      PIP_NO_CACHE_DIR: "false"
      # 非交互标志（备份，仍然使用 yes 管道以防 buildozer 提示）
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Android SDK / build tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system packages required for building Kivy / Android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            python3.11-dev \
            git \
            unzip \
            wget \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            libgirepository1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libglib2.0-dev \
            libmtdev-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsdl2-dev \
            libjpeg-dev \
            libfreetype6-dev

      - name: Create and activate virtualenv
        run: |
          python -m venv .venv
          # activate in bash steps
          source .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Install Python build tools and Buildozer (in venv)
        run: |
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install cython
          pip install --upgrade buildozer

      - name: Install project Python requirements (if any)
        run: |
          source .venv/bin/activate
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Prepare Buildozer configuration (optional)
        run: |
          # Ensure buildozer.spec exists or adjust as needed.
          if [ ! -f buildozer.spec ]; then
            echo "WARNING: buildozer.spec not found in repo root. Make sure you have it configured."
          fi

      - name: Run buildozer to build Android debug APK (non-interactive)
        working-directory: ${{ github.workspace }}
        run: |
          source .venv/bin/activate
          # Ensure we run as non-root (runner already non-root). If any prior step used sudo creating root artifacts,
          # avoid running buildozer with sudo. Pipe 'yes' to auto-confirm any prompts as fallback.
          yes y | buildozer -v android debug
        env:
          # Ensure no accidental elevation; keep these unset or set to non-root
          HOME: ${{ runner.temp }}
